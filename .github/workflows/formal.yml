name: Formal Study - Benchmark Discriminative Power

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swe-bench-discriminative-power-formal
  cancel-in-progress: false

jobs:
  formal-study:
    name: Collect both panels, validate, analyze, and report
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out experiment package
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -v

      - name: Run formal two-panel study
        run: python src/formal_experiment.py --config configs/formal.json --output formal-output

      - name: Verify paper-facing outputs
        run: |
          test -s formal-output/report.html
          test -s formal-output/summary.md
          test -s formal-output/formal_metrics.csv
          test -s formal-output/secondary_metrics_online_resource.csv
          test -s formal-output/analysis_history.md
          test -s formal-output/threshold_sensitivity.csv
          test -s formal-output/longitudinal.csv
          test -s formal-output/formal_results.json
          test -s formal-output/data_quality.json
          test -s formal-output/source_manifest.json
          test -s formal-output/harmonized_metrics.csv
          test -s formal-output/harmonized_decisions.csv
          test -s formal-output/budget_stability.csv
          test -s formal-output/curve_band_diagnostics.csv
          test -s formal-output/curve_bootstrap_stability.csv
          test -s formal-output/random_curve_coupling_sensitivity.csv
          test -s formal-output/selection_overlap.csv
          test -s formal-output/fixed_selection_sensitivity.csv
          test -s formal-output/fixed_selection_decisions.csv
          test -s formal-output/cluster_mapping.csv
          test -s formal-output/bootstrap_stability.csv
          test -s formal-output/cluster_sensitivity.csv
          test -s formal-output/cluster_sensitivity_decisions.csv

      - name: Verify manuscript result-table consistency
        run: python manuscript/scripts/sync_result_tables.py --artifact formal-output --check

      - name: Upload formal research artifact
        uses: actions/upload-artifact@v6
        with:
          name: swe-bench-formal-discriminative-power-study
          path: formal-output/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
