name: SWE-bench Discriminative Power Pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swe-bench-discriminative-power-pilot
  cancel-in-progress: false

jobs:
  pilot:
    name: Collect, validate, analyze, and report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out experiment package
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -v

      - name: Run remote pilot
        run: python src/experiment.py --config configs/pilot.json --output pilot-output

      - name: Verify required outputs
        run: |
          test -s pilot-output/report.html
          test -s pilot-output/summary.md
          test -s pilot-output/metrics.csv
          test -s pilot-output/metrics.json
          test -s pilot-output/data_manifest.json

      - name: Upload compact research artifact
        uses: actions/upload-artifact@v6
        with:
          name: swe-bench-discriminative-power-pilot
          path: pilot-output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
